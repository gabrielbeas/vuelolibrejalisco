<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 640">
  <defs>
    <linearGradient id="viento-la-ceja-grad" x1="470" y1="260" x2="470" y2="580" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38A169"/>
      <stop offset="50%" stop-color="#68D391"/>
      <stop offset="100%" stop-color="#38A169"/>
    </linearGradient>
  </defs>

  <!-- Compass circle -->
  <circle cx="350" cy="320" r="230" fill="none" stroke="#171923" stroke-width="2"/>

  <!-- Cross axes -->
  <line x1="350" y1="90" x2="350" y2="550" stroke="#171923" stroke-width="2"/>
  <line x1="120" y1="320" x2="580" y2="320" stroke="#171923" stroke-width="2"/>

  <!-- Favorable wind wedge: Este (0°) -> Sureste (45°) -> Sur (90°) -->
  <path d="M 350 320 L 580 320 A 230 230 0 0 1 350 550 Z" fill="url(#viento-la-ceja-grad)" stroke="#171923" stroke-width="2" stroke-linejoin="round"/>

  <!-- Divider line at Sureste -->
  <line x1="350" y1="320" x2="512.63" y2="482.63" stroke="#171923" stroke-width="2"/>

  <!-- Cardinal labels -->
  <text x="350" y="50" text-anchor="middle" font-family="Inter, sans-serif" font-size="32" fill="#171923">NORTE</text>
  <text x="350" y="612" text-anchor="middle" font-family="Inter, sans-serif" font-size="32" fill="#171923">SUR</text>
  <text x="600" y="330" text-anchor="start" font-family="Inter, sans-serif" font-size="32" fill="#171923">ESTE</text>
  <text x="100" y="330" text-anchor="end" font-family="Inter, sans-serif" font-size="32" fill="#171923">OESTE</text>
</svg>
